<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ghi chú đạo diễn</title>
<style>
  :root { --bg:#16131f; --panel:#221d2e; --line:#3a3350; --ink:#efeaf6; --dim:#a69cbc; --acc:#b4f02e; --red:#ff6a6a; --rule:#ffcf5a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { padding:10px 16px; display:flex; gap:12px; align-items:baseline; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; } header span { color:var(--dim); }
  main { display:grid; grid-template-columns: minmax(0,1fr) 380px; gap:14px; padding:14px; }
  video { width:100%; background:#000; border-radius:6px; display:block; }
  #strip { position:relative; height:34px; margin-top:8px; background:var(--panel); border-radius:4px; overflow:hidden; cursor:pointer; }
  .sh { position:absolute; top:0; bottom:0; border-right:1px solid var(--bg); font-size:10px; color:var(--dim); padding:2px 3px; overflow:hidden; white-space:nowrap; }
  .sh.cur { background:#3a3350; color:var(--ink); }
  .pin { position:absolute; top:0; width:3px; height:100%; background:var(--red); } .pin.rule { background:var(--rule); } .pin.done { background:#5a8a5a; }
  #head { position:absolute; top:0; width:2px; height:100%; background:var(--acc); pointer-events:none; }
  #now { margin:8px 0; color:var(--dim); } #now b { color:var(--ink); }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px; }
  textarea { width:100%; min-height:70px; background:#141020; color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:8px; font:inherit; resize:vertical; }
  .row { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  select, button { background:#141020; color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:5px 8px; font:inherit; }
  button.go { background:var(--acc); color:#1a1a1a; border:0; font-weight:600; }
  label.sc { display:flex; gap:4px; align-items:center; color:var(--dim); }
  #list { margin-top:12px; display:flex; flex-direction:column; gap:8px; max-height:calc(100vh - 330px); overflow:auto; }
  .n { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--red); border-radius:4px; padding:8px; }
  .n.rule { border-left-color:var(--rule); } .n.done { opacity:.55; border-left-color:#5a8a5a; }
  .n .meta { color:var(--dim); font-size:12px; display:flex; gap:8px; align-items:center; } .n .meta a { color:var(--acc); cursor:pointer; }
  .n .txt { margin-top:4px; white-space:pre-wrap; } .n .meta .sp { flex:1; }
  kbd { background:#141020; border:1px solid var(--line); border-radius:3px; padding:0 4px; font-size:12px; }
  .help { color:var(--dim); font-size:12px; margin-top:6px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } #list { max-height:none; } }
</style>
</head>
<body>
<header><h1 id="title">Ghi chú đạo diễn</h1><span id="sub"></span></header>
<main>
  <section>
    <video id="v" controls preload="auto"></video>
    <div id="strip"><div id="head"></div></div>
    <div id="now"></div>
  </section>
  <aside>
    <div class="box">
      <textarea id="txt" placeholder="Ví dụ: tia quét qua thì toà nhà bên trái phải vỡ, gạch rơi, bụi, máy quay rung"></textarea>
      <div class="row">
        <label class="sc"><input type="radio" name="scope" value="shot" checked> Chỉ shot này</label>
        <label class="sc"><input type="radio" name="scope" value="rule"> Luật chung</label>
        <select id="kind">
          <option value="fx">Hậu quả / hiệu ứng</option><option value="acting">Diễn xuất</option><option value="camera">Máy quay</option>
          <option value="colour">Màu / ánh sáng</option><option value="timing">Nhịp / cắt</option><option value="sound">Âm thanh</option>
          <option value="character">Nhân vật</option><option value="story">Câu chuyện</option>
        </select>
        <button class="go" id="add">Lưu ghi chú</button>
      </div>
      <div class="help"><kbd>N</kbd> dừng video và ghi chú tại giây đang xem · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> lưu · <kbd>Space</kbd> phát/dừng · <kbd>,</kbd> <kbd>.</kbd> lùi/tới 1 khung</div>
    </div>
    <div id="list"></div>
  </aside>
</main>
<script>
const $ = (s) => document.querySelector(s), v = $('#v');
let P = null, notes = [];
const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;
const shotAt = (t) => P.shots.find(s => t >= s.start && t < s.end) || P.shots[P.shots.length - 1];
const dur = () => (v.duration && isFinite(v.duration)) ? v.duration : P.shots[P.shots.length - 1].end;
async function load() {
  P = await (await fetch('/api/project')).json(); notes = P.notes || [];
  $('#title').textContent = 'Ghi chú đạo diễn: ' + P.title; $('#sub').textContent = P.video ? P.video : 'chưa có video (render trước)';
  v.src = '/video'; drawStrip(); drawList(); tick();
}
function drawStrip() {
  const st = $('#strip'); st.querySelectorAll('.sh,.pin').forEach(e => e.remove()); const D = dur();
  for (const s of P.shots) { const d = document.createElement('div'); d.className = 'sh'; d.dataset.id = s.id; d.style.left = (s.start / D * 100) + '%'; d.style.width = ((s.end - s.start) / D * 100) + '%'; d.textContent = s.id; d.title = `${s.id} ${fmt(s.start)}–${fmt(s.end)} ${s.scene}`; st.appendChild(d); }
  for (const n of notes) { const p = document.createElement('div'); p.className = 'pin' + (n.scope === 'rule' ? ' rule' : '') + (n.status === 'done' ? ' done' : ''); p.style.left = (n.t / D * 100) + '%'; p.title = n.text; st.appendChild(p); }
}
function drawList() {
  const L = $('#list'); L.innerHTML = '';
  for (const n of [...notes].sort((a, b) => a.t - b.t)) {
    const d = document.createElement('div'); d.className = 'n' + (n.scope === 'rule' ? ' rule' : '') + (n.status === 'done' ? ' done' : '');
    d.innerHTML = `<div class="meta"><a data-t="${n.t}">${fmt(n.t)} · ${n.shot}</a><span>${n.scope === 'rule' ? 'LUẬT CHUNG' : 'shot'} · ${$('#kind').querySelector(`[value="${n.kind}"]`)?.textContent || n.kind}</span><span class="sp"></span>
      <label class="sc"><input type="checkbox" ${n.status === 'done' ? 'checked' : ''} data-done="${n.id}"> xong</label><a data-del="${n.id}">xoá</a></div><div class="txt"></div>`;
    d.querySelector('.txt').textContent = n.text + (n.done_note ? `\n→ ${n.done_note}` : ''); L.appendChild(d);
  }
}
async function save() { await fetch('/api/notes', { method: 'POST', body: JSON.stringify({ notes }) }); drawStrip(); drawList(); }
function add() {
  const text = $('#txt').value.trim(); if (!text) return; const t = +v.currentTime.toFixed(2);
  const n = { id: 'n' + String(Date.now()).slice(-7), t, shot: shotAt(t).id, scope: document.querySelector('[name=scope]:checked').value, kind: $('#kind').value, text, status: 'open', created: new Date().toISOString() };
  notes.push(n); $('#txt').value = ''; save();
}
function tick() { const t = v.currentTime || 0, s = shotAt(t); $('#head').style.left = (t / dur() * 100) + '%';
  document.querySelectorAll('.sh').forEach(e => e.classList.toggle('cur', e.dataset.id === s.id));
  $('#now').innerHTML = `<b>${fmt(t)}</b> · shot <b>${s.id}</b> ${s.scene ? '· ' + s.scene : ''} ${s.rules.length ? '· luật ' + s.rules.join(', ') : ''}`; requestAnimationFrame(tick); }
$('#add').onclick = add;
$('#strip').onclick = (e) => { if (e.target.closest('#head')) return; const r = $('#strip').getBoundingClientRect(); v.currentTime = (e.clientX - r.left) / r.width * dur(); };
$('#list').onclick = (e) => { const a = e.target;
  if (a.dataset.t) { v.currentTime = +a.dataset.t; v.pause(); }
  if (a.dataset.del && confirm('Xoá ghi chú này?')) { notes = notes.filter(n => n.id !== a.dataset.del); save(); }
  if (a.dataset.done) { const n = notes.find(n => n.id === a.dataset.done); n.status = a.checked ? 'done' : 'open'; save(); } };
v.addEventListener('loadedmetadata', drawStrip);
document.addEventListener('keydown', (e) => { const typing = document.activeElement === $('#txt');
  if (typing && e.key === 'Enter' && e.ctrlKey) { add(); e.preventDefault(); return; } if (typing) return;
  if (e.key === 'n' || e.key === 'N') { v.pause(); $('#txt').focus(); e.preventDefault(); }
  if (e.key === ' ') { v.paused ? v.play() : v.pause(); e.preventDefault(); }
  if (e.key === ',') { v.pause(); v.currentTime = Math.max(0, v.currentTime - 1 / 60); } if (e.key === '.') { v.pause(); v.currentTime += 1 / 60; } });
load();
</script>
</body>
</html>
